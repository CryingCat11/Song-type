<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Допой строчку</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Karaoke room: one dark look. PC = video left, lyrics right. Phone = video on top, lyrics + input under it. */
:root{
  --bg:#14101a; --panel:#1e1826; --line:#352c40; --fg:#f2ece4; --muted:#9a8fa6; --dim:#4a4056;
  --lamp:#ffb547; --ok:#7fe3a5; --bad:#ff6b6b; --hint:#7cc4ff;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255,181,71,.10), transparent 70%);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:clamp(20px,4vw,28px);letter-spacing:-.01em;margin:0;cursor:pointer}
.logo span{color:var(--lamp)}
.hright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{background:none;border:0;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--lamp);color:#1b1206}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
a{color:var(--hint)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-weight:600;font-size:15px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn.main{background:var(--lamp);color:#1b1206;border-color:var(--lamp)}
.btn.danger{border-color:rgba(255,107,107,.5);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.intro{display:flex;flex-direction:column;gap:8px}
.intro h2{font-family:var(--display);font-weight:700;font-size:clamp(24px,5vw,40px);line-height:1.1;margin:0;text-wrap:balance}
.intro p{margin:0;color:var(--muted);max-width:65ch}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;flex:1 1 220px}
.opt b{font-weight:600}
.opt small{color:var(--muted);font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--lamp);background:rgba(255,181,71,.08)}
.songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.song{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0;text-align:left;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.song:hover{border-color:var(--lamp)}
.song img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--line)}
.song .in{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.song .t{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.25}
.song .a{color:var(--muted);font-size:14px}
.song .best{font-size:12px;color:var(--ok);font-family:var(--mono)}
.song.add{border-style:dashed;background:transparent;justify-content:center;min-height:120px}
.song .del{font-size:12px;color:var(--muted);text-decoration:underline}
/* game */
.game{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.vid{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;max-width:100%}
.vid iframe,.vid #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,16,26,.88);text-align:center;padding:16px;z-index:2}
.vid.novid{aspect-ratio:auto}
.vid.novid .cover{position:static;padding:20px 16px}
.vid.novid #yt{display:none}
.cover p{margin:0;color:var(--muted);max-width:40ch}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.hud{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.hud div{border:1px solid var(--line);border-radius:8px;padding:5px 9px;color:var(--muted)}
.hud b{color:var(--fg)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:10px;min-width:0}
.prev{margin:0;font-size:15px;min-height:1.5em;color:var(--muted)}
.prev .res{font-family:var(--mono);font-size:12px;margin-left:6px}
.next{margin:0;font-size:15px;color:var(--dim);min-height:1.5em}
.target{font-family:var(--mono);font-weight:700;font-size:clamp(18px,2.4vw,26px);line-height:1.55;margin:0;word-break:break-word;min-height:3.1em}
.target .w{display:inline-block;white-space:nowrap}
.target .l{color:var(--dim)}
.target .l.ok{color:var(--lamp);text-shadow:0 0 12px rgba(255,181,71,.45)}
.target .l.bad{color:var(--bad)}
.target .l.shown{color:var(--fg);opacity:.4}
.target .l.cur{border-bottom:3px solid var(--lamp)}
.target .p{color:var(--muted)}
.target.wait{font-family:var(--body);font-weight:500;color:var(--muted);font-size:18px}
.timebar{height:5px;background:var(--line);border-radius:5px;overflow:hidden}
.timebar i{display:block;height:100%;background:var(--lamp);width:0}
.timebar.low i{background:var(--bad)}
.stage.flash{animation:flash .5s}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(127,227,165,.6)}100%{box-shadow:0 0 0 16px rgba(127,227,165,0)}}
#answer{width:100%;background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:13px 15px;font:500 18px var(--body)}
#answer:focus{border-color:var(--lamp);outline:none}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1 1 auto}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.sync b{font-family:var(--mono);color:var(--fg);min-width:5ch;text-align:center}
.msg{min-height:1.4em;margin:0;font-size:14px;color:var(--muted)}
.keys{font-size:12px;color:var(--muted);margin:0}
.keys kbd{font-family:var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px}
/* results */
.result{display:flex;flex-direction:column;gap:16px}
.big{font-family:var(--display);font-weight:800;font-size:clamp(44px,12vw,88px);color:var(--lamp);line-height:1;margin:0;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stats small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.stats b{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:10px}
.lines li{display:flex;gap:10px;font-size:14px}
.lines li span:first-child{font-family:var(--mono);width:4.5ch;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.g{color:var(--ok)}.m{color:var(--lamp)}.r{color:var(--bad)}
/* form */
form{display:flex;flex-direction:column;gap:10px;max-width:720px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
form input,form textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:16px var(--body);width:100%}
form textarea{min-height:160px;resize:vertical;font-family:var(--mono);font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.load{display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* PHONE VIEW */
[data-view="phone"] .wrap{max-width:460px;gap:14px;padding-block:12px 24px}
[data-view="phone"] .game{grid-template-columns:1fr;gap:10px}
[data-view="phone"] .vid{border-radius:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:3}
[data-view="phone"] .songs{grid-template-columns:1fr}
[data-view="phone"] .row{grid-template-columns:1fr}
[data-view="phone"] .keys{display:none}
[data-view="phone"] .btn{padding:12px 14px;font-size:15px}
[data-view="phone"] .opt{flex-basis:100%}
[data-view="phone"] .target{font-size:clamp(17px,5.4vw,22px)}
[data-view="phone"] .actions .btn{flex:1 1 0}
@media (min-width:600px){[data-view="phone"] .wrap{border-inline:1px solid var(--line);border-radius:0 0 24px 24px;min-height:100vh}}
@media (max-width:820px){.game{grid-template-columns:1fr}}
@media (max-width:560px){.row{grid-template-columns:1fr}.keys{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo" id="home" tabindex="0">Допой<span>.</span>строчку</h1>
    <div class="hright">
      <div class="seg" id="viewSeg" role="group" aria-label="Версия"><button data-v="pc">ПК</button><button data-v="phone">Телефон</button></div>
    </div>
  </header>
  <main id="app"></main>
</div>

<script>
/* ===== Songs. yt = YouTube video id. Lyrics with timings load from lrclib.net in the browser. ===== */
const BUILTIN=[
  {id:'dynasty',title:'ДИНАСТИЯ',artist:'VILLIAN, madk1d',lrcArtist:'VILLIAN',yt:['J7NFL-eOxiQ','p-LBiCtzXu0']},
  {id:'67',title:'67 (Six Seven)',artist:'GAZAN',lrcTitle:'67',yt:['XEGmDSAKJfk','a8sLiNEB9LU','yo5CILhgvT4','iTkVZdai1es']},
  {id:'rich',title:'Быть богатым',artist:'Voskresenskii, Платина',lrcArtist:'Voskresenskii',yt:['tzwyHxK_GK0','X1-MXdyThJ0','5ykv5hCMeW0','HxM1Uvek2yQ']}
];
const MOCK=/[?&]mock/.test(location.search);

const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const $=id=>document.getElementById(id);
const app=$('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isL=c=>/[0-9a-zа-яё]/i.test(c);
const norm=c=>c.toLowerCase().replace('ё','е');
const normStr=s=>[...s].filter(isL).map(norm).join('');
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const m=n%10;return n>10&&n<20?c:m>1&&m<5?b:m==1?a:c};
const fmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const allSongs=()=>BUILTIN.map(s=>({...s,...(store.get('dp_ov_'+s.id,{}))})).concat(store.get('dp_custom',[]));
let opt=Object.assign({wait:false,hide:false},store.get('dp_opt',{}));

/* ===== PC / phone switch (one app) ===== */
function setView(v){document.documentElement.dataset.view=v;store.set('dp_view',v);
  document.querySelectorAll('#viewSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v))}
let guess='pc';try{if(matchMedia('(pointer:coarse)').matches||innerWidth<600)guess='phone'}catch(e){}
setView(store.get('dp_view',guess));
document.querySelectorAll('#viewSeg button').forEach(b=>b.onclick=()=>setView(b.dataset.v));

/* ===== Lyrics: LRC from lrclib.net ===== */
function parseLRC(txt){
  const out=[];
  for(const raw of txt.split(/\r?\n/)){
    const tags=[...raw.matchAll(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g)];
    if(!tags.length)continue;
    const text=raw.replace(/\[[^\]]*\]/g,'').trim();
    for(const m of tags)out.push({t:+m[1]*60+parseFloat(m[2].replace(':','.')),text});
  }
  out.sort((a,b)=>a.t-b.t);
  return out;
}
async function fetchLRC(song){
  if(song.lrc)return song.lrc;
  const cached=store.get('dp_lrc_'+song.id,null);if(cached)return cached;
  if(MOCK)return MOCK_LRC;
  const artist=song.lrcArtist||song.artist, track=song.lrcTitle||song.title;
  const api='https://lrclib.net/api/';
  const tries=[
    api+'search?'+new URLSearchParams({artist_name:artist,track_name:track}),
    api+'search?'+new URLSearchParams({q:artist+' '+track}),
    api+'search?'+new URLSearchParams({q:track})
  ];
  for(const u of tries){
    try{const r=await fetch(u);if(!r.ok)continue;const list=await r.json();
      const hit=list.find(x=>x.syncedLyrics&&normStr(x.trackName).includes(normStr(track)))||list.find(x=>x.syncedLyrics);
      if(hit){store.set('dp_lrc_'+song.id,hit.syncedLyrics);return hit.syncedLyrics}}catch(e){}
  }
  return null;
}

/* ===== YouTube player ===== */
let ytReady=null;
function loadYT(){
  if(MOCK)return Promise.resolve();
  if(ytReady)return ytReady;
  ytReady=new Promise(res=>{window.onYouTubeIframeAPIReady=res;const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s)});
  return ytReady;
}
function ytId(s){s=s.trim();const m=s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:(/^[\w-]{11}$/.test(s)?s:null)}

/* ===== Home ===== */
function home(){
  stopGame();
  const best=store.get('dp_best',{});
  app.innerHTML=`<div style="display:flex;flex-direction:column;gap:20px">
   <section class="intro"><h2>Успей набрать строчку, пока её поют</h2>
    <p>Включается клип, строчки появляются ровно под звук. Набирай текущую, пока не началась следующая. Регистр, «ё» и знаки препинания не важны, пробелы тоже.</p></section>
   <div class="opts">
    <button class="opt" id="oWait" aria-pressed="${opt.wait}"><b>Клип ждёт меня</b><small>${opt.wait?'Включено: клип встаёт на паузу, пока не допишешь строчку':'Выключено: клип не ждёт, не успел — строчка уходит'}</small></button>
    <button class="opt" id="oHide" aria-pressed="${opt.hide}"><b>По памяти</b><small>${opt.hide?'Включено: текст скрыт, видно только количество букв':'Выключено: текст строчки виден, набираешь на скорость'}</small></button>
   </div>
   <div class="songs">${allSongs().map(s=>`
    <button class="song" data-id="${esc(s.id)}">
     <img alt="" loading="lazy" src="https://i.ytimg.com/vi/${esc([].concat(s.yt)[0])}/hqdefault.jpg">
     <span class="in"><span class="t">${esc(s.title)}</span><span class="a">${esc(s.artist)}</span>
     ${best[s.id]?`<span class="best">Рекорд: ${best[s.id]}</span>`:''}
     ${s.custom?`<span class="del" data-del="${esc(s.id)}">удалить</span>`:''}</span></button>`).join('')}
    <button class="song add" id="addBtn"><span class="in"><span class="t">+ Добавить песню</span><span class="a">Ссылка на клип и название, текст подтянется сам</span></span></button>
   </div></div>`;
  $('oWait').onclick=()=>{opt.wait=!opt.wait;store.set('dp_opt',opt);home()};
  $('oHide').onclick=()=>{opt.hide=!opt.hide;store.set('dp_opt',opt);home()};
  app.querySelectorAll('.song[data-id]').forEach(b=>b.onclick=e=>{
    const d=e.target.closest('[data-del]');
    if(d){store.set('dp_custom',store.get('dp_custom',[]).filter(s=>s.id!==d.dataset.del));home();return}
    start(allSongs().find(s=>s.id===b.dataset.id))});
  $('addBtn').onclick=()=>addForm();
}

/* ===== Add / fix song ===== */
function addForm(edit,note){
  const s=edit||{};
  app.innerHTML=`<form id="f"><h2 class="logo" style="font-size:22px">${edit?'Поправить песню':'Своя песня'}</h2>
   ${note?`<p class="msg" style="color:var(--bad)">${esc(note)}</p>`:''}
   <label>Ссылка на клип YouTube<input id="fy" required value="${esc(s.yt?'https://youtu.be/'+[].concat(s.yt)[0]:'')}" placeholder="https://www.youtube.com/watch?v=..."></label>
   <div class="row"><label>Исполнитель<input id="fa" required maxlength="80" value="${esc(s.artist||'')}"></label><label>Название<input id="ft" required maxlength="80" value="${esc(s.title||'')}"></label></div>
   <label>Текст с таймингами (LRC), если сам не нашёлся. Можно скопировать на <a href="https://lrclib.net/search/${encodeURIComponent((s.artist||'')+' '+(s.title||''))}" target="_blank" rel="noopener">lrclib.net</a>, поле «Synced lyrics»
    <textarea id="fl" placeholder="[00:12.30] Первая строчка&#10;[00:15.80] Вторая строчка">${esc(s.lrc||'')}</textarea></label>
   <div class="actions"><button type="button" class="btn" id="back">Назад</button><button class="btn main">Сохранить и играть</button></div></form>`;
  $('back').onclick=home;
  $('f').onsubmit=e=>{e.preventDefault();
    const yt=ytId($('fy').value);if(!yt){$('fy').setCustomValidity('Не похоже на ссылку YouTube');$('fy').reportValidity();return}
    const lrc=$('fl').value.trim();
    if(lrc&&!parseLRC(lrc).length){$('fl').setCustomValidity('Нет строк вида [мм:сс.xx] текст');$('fl').reportValidity();return}
    const data={yt,artist:$('fa').value.trim(),title:$('ft').value.trim(),lrc:lrc||undefined};
    let song;
    if(edit&&!edit.custom){store.set('dp_ov_'+edit.id,data);try{localStorage.removeItem('dp_lrc_'+edit.id)}catch(_){};song={...edit,...data}}
    else{const list=store.get('dp_custom',[]).filter(x=>!edit||x.id!==edit.id);song={id:edit?edit.id:'c'+Date.now(),custom:true,...data};list.push(song);store.set('dp_custom',list)}
    start(song)};
  $('fy').oninput=()=>$('fy').setCustomValidity('');$('fl').oninput=()=>$('fl').setCustomValidity('');
}

/* ===== Game ===== */
let G=null;
function stopGame(){if(!G)return;G.dead=true;cancelAnimationFrame(G.raf);try{G.player&&G.player.destroy&&G.player.destroy()}catch(e){};G=null}

async function start(song){
  stopGame();
  app.innerHTML=`<div class="load"><p class="msg">Загружаю текст песни «${esc(song.title)}»…</p></div>`;
  const lrc=await fetchLRC(song);
  const lines=lrc?parseLRC(lrc).filter(l=>normStr(l.text).length):[];
  if(lines.length<2){addForm(song,'Не нашёл текст с таймингами для этой песни. Вставь его ниже, это занимает минуту.');return}
  const vids=[].concat(song.yt);const okVid=store.get('dp_okvid_'+song.id,null);if(okVid&&vids.includes(okVid))vids.unshift(...vids.splice(vids.indexOf(okVid),1));
  const offKey='dp_off_'+song.id+'_'+vids[0];
  G={song,lines,i:-1,res:[],score:0,streak:0,bestStreak:0,chars:0,typedOK:0,offset:store.get(offKey,0),offKey,
     started:false,waiting:false,done:false,dead:false,prevLen:0,mistakes:0,vids,vi:0};
  render();
  await loadYT();if(!G||G.dead)return;
  G.player=MOCK?mockPlayer():new YT.Player('yt',{videoId:vids[0],playerVars:{playsinline:1,rel:0,modestbranding:1,controls:1,cc_load_policy:0,iv_load_policy:3},
    events:{onReady:()=>{G.ready=true;$('coverBtn').disabled=false;$('coverMsg').textContent='Нажми «Старт» и сразу печатай.'},
            onStateChange:e=>{if(e.data===1)store.set('dp_okvid_'+song.id,G.vids[G.vi]);if(e.data===0)finish();if(e.data===1&&!G.started){G.started=true;$('cover').hidden=true;$('msg').textContent='';focusInput()}},
            onError:e=>{const n=e.data;
              if(G&&!G.dead&&G.vi+1<G.vids.length){G.vi++;const v=G.vids[G.vi];G.offKey='dp_off_'+song.id+'_'+v;G.offset=store.get(G.offKey,0);showOffset();
                $('cover').hidden=false;$('coverMsg').textContent='Этот клип нельзя показать на сайте, беру другую загрузку с YouTube ('+(G.vi+1)+' из '+G.vids.length+')…';
                if(G.started){G.player.loadVideoById(v)}else{G.player.cueVideoById(v)}return}
              noVideo(song,n===101||n===150?'YouTube не даёт показать ни одну загрузку этой песни на сайте.':'Видео с YouTube не загрузилось.')}}});
  if(MOCK){$('coverBtn').disabled=false;G.ready=true}
  else setTimeout(()=>{if(G&&!G.dead&&G.song===song&&!G.ready&&!G.started)noVideo(song,'Клип с YouTube не загрузился за 12 секунд.')},12000);
  loop();
}

function render(){
  const s=G.song;
  app.innerHTML=`<div class="game">
   <div class="vid"><div id="yt"></div>
    <div class="cover" id="cover"><b style="font-family:var(--display);font-size:20px">${esc(s.title)}</b><p id="coverMsg">Загружаю клип…</p>
     <button class="btn main" id="coverBtn" disabled>Старт</button></div></div>
   <div class="side">
    <div class="hud"><div>Очки <b id="hs">0</b></div><div>Серия <b id="hk">0</b></div><div>Строчка <b id="hl">0/${G.lines.length}</b></div><div><b id="ht">0:00</b></div></div>
    <section class="stage" id="stage">
     <p class="prev" id="prev"></p>
     <p class="target wait" id="tg">Первая строчка скоро начнётся…</p>
     <div class="timebar" id="tb"><i id="tbi"></i></div>
     <p class="next" id="next">${esc(G.lines[0].text)}</p>
    </section>
    <input id="answer" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" placeholder="Печатай строчку…" aria-label="Ввод строчки">
    <div class="actions"><button class="btn" id="bp">Пауза</button><button class="btn" id="bs">Пропустить</button><button class="btn danger" id="bf">Завершить</button></div>
    <div class="sync">Сдвиг текста <button class="btn sm" id="om">−0,25 с</button><b id="ov"></b><button class="btn sm" id="op">+0,25 с</button><span>если строчки опаздывают или спешат</span></div>
    <p class="msg" id="msg"></p>
    <p class="keys"><kbd>Enter</kbd> пропустить строчку · <kbd>Esc</kbd> пауза</p>
   </div></div>`;
  $('coverBtn').onclick=()=>{
    if(!G.ready&&!MOCK)return;
    $('cover').hidden=true;try{G.player.playVideo()}catch(e){}focusInput();
    // iPhone may refuse to start the clip from our button: then the player taps play on the clip itself
    setTimeout(()=>{if(G&&!G.dead&&!G.started)$('msg').textContent='Если клип не пошёл, нажми ▶ на самом клипе. Строчки подстроятся под видео.'},1500)};
  const inp=$('answer');
  inp.oninput=onType;
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();skip()}else if(e.key==='Escape'){e.preventDefault();togglePause()}};
  $('bp').onclick=togglePause;$('bs').onclick=()=>{skip();focusInput()};$('bf').onclick=finish;
  $('om').onclick=()=>shift(-.25);$('op').onclick=()=>shift(.25);
  showOffset();
}
function focusInput(){const i=$('answer');if(i)i.focus({preventScroll:true})}
function shift(d){G.offset=Math.round((G.offset+d)*100)/100;store.set(G.offKey,G.offset);showOffset()}
function showOffset(){$('ov').textContent=(G.offset>0?'+':'')+G.offset.toFixed(2).replace('.',',')}
function togglePause(){if(!G.player)return;const st=G.player.getPlayerState();if(st===1){G.manualPause=true;G.player.pauseVideo()}else{G.manualPause=false;G.player.playVideo();focusInput()}}
function now(){try{return G.player.getCurrentTime()+G.offset}catch(e){return 0}}
function lineEnd(i){return i+1<G.lines.length?G.lines[i+1].t:G.lines[i].t+Math.max(4,Math.min(10,normStr(G.lines[i].text).length*.35))}

function loop(){
  if(!G||G.dead||G.done)return;
  G.raf=requestAnimationFrame(loop);
  if(!G.player||!G.player.getCurrentTime)return;
  const t=now();
  try{$('bp').textContent=G.player.getPlayerState()===1?'Пауза':'Продолжить';$('ht').textContent=fmt(t)}catch(e){}
  // which line is being sung now
  let a=-1;for(let k=0;k<G.lines.length;k++){if(G.lines[k].t<=t)a=k;else break}
  if(a>=G.lines.length-1&&t>=lineEnd(G.lines.length-1)&&G.i===G.lines.length-1&&!G.waiting){grade(G.i,false);G.i=G.lines.length;showLine();return finish()}
  if(G.waiting){ // "клип ждёт": hold at end of the line until it is typed or skipped
    if(G.player.getPlayerState()===1&&t>=lineEnd(G.i)-.05)G.player.pauseVideo();
    updateBar(t);return;
  }
  if(a!==G.i){
    if(a>G.i&&G.i>=0&&!G.res[G.i]){
      if(opt.wait){G.waiting=true;G.player.pauseVideo();$('msg').textContent='Клип ждёт: допиши строчку или нажми «Пропустить».';updateBar(t);return}
      grade(G.i,false);
    }
    G.i=a;showLine();
  }
  updateBar(t);
}
function updateBar(t){
  if(G.i<0){const left=G.lines[0].t-t;$('tbi').style.width='0';if(left>0&&left<3.5)$('tg').textContent='Приготовься… '+Math.ceil(left);return}
  const s=G.lines[G.i].t,e=lineEnd(G.i),p=Math.min(1,Math.max(0,(t-s)/(e-s)));
  $('tbi').style.width=(100-p*100)+'%';$('tb').classList.toggle('low',p>.75);
}
function showLine(){
  const L=G.lines,i=G.i;
  const pr=i>0?G.res[i-1]:null;
  $('prev').innerHTML=i>0?`${esc(L[i-1].text)}${pr?`<span class="res ${pr.pct===100?'g':pr.pct>=50?'m':'r'}">${pr.pct}%</span>`:''}`:'';
  $('next').textContent=i+1<L.length?L[i+1].text:'';
  $('hl').textContent=Math.max(0,Math.min(i+1,L.length))+'/'+L.length;
  const inp=$('answer');inp.value='';G.prevLen=0;G.lineMist=0;
  if(i>=0&&i<L.length){$('tg').classList.remove('wait');paint('')}
}
function paint(typed,full){
  const line=G.lines[G.i].text;let j=0,html='';
  for(const w of line.split(/(\s+)/)){
    if(!w)continue;if(/^\s+$/.test(w)){html+=' ';continue}
    html+='<span class="w">';
    for(const ch of w){
      if(!isL(ch)){html+=`<span class="p">${esc(ch)}</span>`;continue}
      let cls='l',show;
      if(full){cls+=' ok';show=ch}
      else if(j<typed.length){const good=typed[j]===norm(ch);cls+=good?' ok':' bad';show=good?ch:typed[j]}
      else{show=opt.hide?'_':ch;if(!opt.hide)cls+=' shown';if(j===typed.length)cls+=' cur'}
      html+=`<span class="${cls}">${esc(show)}</span>`;j++}
    html+='</span>'}
  $('tg').innerHTML=html;
}
function onType(){
  if(G.i<0||G.i>=G.lines.length||G.res[G.i]){$('answer').value='';return}
  const t=normStr($('answer').value),target=normStr(G.lines[G.i].text);
  for(let k=G.prevLen;k<t.length;k++){if(t[k]!==target[k])G.mistakes++;else G.chars++}
  G.prevLen=Math.max(G.prevLen,t.length);paint(t);
  if(t===target)grade(G.i,true);
}
function grade(i,complete){
  if(i<0||i>=G.lines.length||G.res[i])return;
  const target=normStr(G.lines[i].text),t=i===G.i?normStr($('answer').value):'';
  let ok=0;for(let k=0;k<target.length;k++)if(t[k]===target[k])ok++;
  const pct=Math.round(ok/target.length*100);
  let pts;
  if(complete){const e=lineEnd(i),left=Math.max(0,(e-now())/(e-G.lines[i].t));pts=100+Math.round(left*50);G.streak++;G.bestStreak=Math.max(G.bestStreak,G.streak)}
  else{pts=Math.round(pct*.6);G.streak=0}
  if(complete&&G.streak>=3)pts+=25;
  G.score+=pts;G.typedOK+=ok;G.res[i]={pct,pts,complete};
  $('hs').textContent=G.score;$('hk').textContent=G.streak;
  $('msg').textContent=complete?`+${pts}${G.streak>=3?' (серия!)':''}`:(pct?`Не успел: ${pct}% строчки, +${pts}`:'Строчка ушла');
  if(complete&&i===G.i){paint('',true);const s=$('stage');s.classList.remove('flash');void s.offsetWidth;s.classList.add('flash');$('answer').value=''}
  if(G.waiting){G.waiting=false;if(!G.manualPause)G.player.playVideo()}
}
function skip(){
  if(G.i<0)return;
  if(G.i<G.lines.length&&!G.res[G.i]){grade(G.i,false);paint('',true)}
  if(G.waiting){G.waiting=false;G.player.playVideo()}
}
function finish(){
  if(!G||G.done)return;G.done=true;cancelAnimationFrame(G.raf);
  try{G.player.pauseVideo()}catch(e){}
  if(G.i>=0&&G.i<G.lines.length&&!G.res[G.i])grade(G.i,false);
  const reached=G.lines.filter((_,k)=>G.res[k]);const n=reached.length;
  const full=G.res.filter(r=>r&&r.complete).length;
  const letters=G.lines.reduce((s,l,k)=>s+(G.res[k]?normStr(l.text).length:0),0);
  const acc=letters?Math.round(G.typedOK/letters*100):0;
  const sec=Math.max(1,G.lines[Math.min(G.i,G.lines.length-1)].t-G.lines[0].t);
  const best=store.get('dp_best',{}),rec=G.score>(best[G.song.id]||0);if(rec){best[G.song.id]=G.score;store.set('dp_best',best)}
  const song=G.song,lines=G.lines,res=G.res;
  try{G.player.destroy()}catch(e){}
  G.dead=true;
  app.innerHTML=`<section class="result">
   <p class="msg">${esc(song.artist)} · ${esc(song.title)}${rec?' · новый рекорд':''}</p>
   <p class="big">${G.score}</p>
   <div class="stats">
    <div><small>Набрано целиком</small><b>${full}/${n}</b></div>
    <div><small>Точность</small><b>${acc}%</b></div>
    <div><small>Знаков в минуту</small><b>${Math.round(G.typedOK/sec*60)}</b></div>
    <div><small>Лучшая серия</small><b>${G.bestStreak}</b></div>
   </div>
   <div class="actions"><button class="btn main" id="again">Ещё раз</button><button class="btn" id="other">Другая песня</button></div>
   ${n?`<ul class="lines">${lines.map((l,k)=>res[k]?`<li><span class="${res[k].pct===100?'g':res[k].pct>=50?'m':'r'}">${res[k].pct}%</span><span>${esc(l.text)}</span></li>`:'').join('')}</ul>`:''}
  </section>`;
  $('again').onclick=()=>start(song);$('other').onclick=home;
}

/* ===== test mode (?mock): fake player + fake lyrics, no network ===== */
const MOCK_LRC='[00:01.00]Первая тестовая строчка\n[00:04.00]Вторая строчка тут\n[00:07.00]Третья и последняя';
/* No embeddable video: play with a clock, the player starts the song in their own music app */
function noVideo(song,why){
  if(!G||G.dead)return;
  try{G.player.destroy()}catch(e){}
  G.player=null;G.started=false;
  const c=$('cover');c.hidden=false;c.parentNode.classList.add('novid');
  c.innerHTML=`<b style="font-family:var(--display);font-size:18px">${esc(why)}</b>
   <p>Можно играть без клипа: включи «${esc(song.title)}» в своём плеере (Яндекс Музыка, VK, Spotify) и нажми «Старт» в ту же секунду, когда пойдёт трек. Если строчки опаздывают или спешат, поправь кнопками сдвига.</p>
   <div class="actions" style="justify-content:center"><button class="btn main" id="clockGo">Старт</button><button class="btn" id="otherLink">Другая ссылка</button></div>`;
  $('otherLink').onclick=()=>addForm(song);
  $('clockGo').onclick=()=>{G.player=mockPlayer();G.player.playVideo();focusInput()};
}
function mockPlayer(){let t0=null,acc=0,st=-1;return{
  playVideo(){if(st!==1){t0=performance.now();st=1;if(!G.started){G.started=true;$('cover').hidden=true}}},
  pauseVideo(){if(st===1){acc+=(performance.now()-t0)/1000;st=2}},
  getCurrentTime(){return acc+(st===1?(performance.now()-t0)/1000:0)},
  getPlayerState(){return st},destroy(){}}}

const homeEl=$('home');homeEl.onclick=home;homeEl.onkeydown=e=>{if(e.key==='Enter')home()};
home();
</script>
