<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Допой строчку</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Karaoke room: one dark look. PC = video left, lyrics right. Phone = video on top, lyrics + input under it. */
:root{
  --bg:#14101a; --panel:#1e1826; --line:#352c40; --fg:#f2ece4; --muted:#9a8fa6; --dim:#4a4056;
  --lamp:#ffb547; --ok:#7fe3a5; --bad:#ff6b6b; --hint:#7cc4ff;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255,181,71,.10), transparent 70%);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:clamp(20px,4vw,28px);letter-spacing:-.01em;margin:0;cursor:pointer}
.logo span{color:var(--lamp)}
.hright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{background:none;border:0;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--lamp);color:#1b1206}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
a{color:var(--hint)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-weight:600;font-size:15px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn.main{background:var(--lamp);color:#1b1206;border-color:var(--lamp)}
.btn.danger{border-color:rgba(255,107,107,.5);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.intro{display:flex;flex-direction:column;gap:8px}
.intro h2{font-family:var(--display);font-weight:700;font-size:clamp(24px,5vw,40px);line-height:1.1;margin:0;text-wrap:balance}
.intro p{margin:0;color:var(--muted);max-width:65ch}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;flex:1 1 220px}
.opt b{font-weight:600}
.opt small{color:var(--muted);font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--lamp);background:rgba(255,181,71,.08)}
.songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.song{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0;text-align:left;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.song:hover{border-color:var(--lamp)}
.song img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--line)}
.song .in{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.song .t{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.25}
.song .a{color:var(--muted);font-size:14px}
.song .best{font-size:12px;color:var(--ok);font-family:var(--mono)}
.song.add{border-style:dashed;background:transparent;justify-content:center;min-height:120px}
.song .del{font-size:12px;color:var(--muted);text-decoration:underline}
/* game */
.game{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.vid{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;max-width:100%}
.vid iframe,.vid #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,16,26,.88);text-align:center;padding:16px;z-index:2}
.vid.novid{aspect-ratio:auto}
.vid.novid .cover{position:static;padding:20px 16px}
.vid.novid #yt{display:none}
.vcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.startbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.startbar p{margin:0;color:var(--muted);font-size:14px;flex:1 1 200px}
/* Phone, during a song: everything that matters (clip, line, input) fits in the top ~400px,
   so it all stays visible above the keyboard without anything floating over the page. */
[data-view="phone"].ingame header{display:none}
[data-view="phone"].ingame .wrap{padding-block:6px 24px;gap:8px}
[data-view="phone"].ingame .game{gap:6px}
[data-view="phone"].ingame .side{gap:6px}
[data-view="phone"].ingame .vcol{gap:6px}
[data-view="phone"].ingame .stats3{gap:8px}
[data-view="phone"].ingame .bar{flex-wrap:nowrap;align-items:center}
[data-view="phone"].ingame .ctrl{gap:4px}
[data-view="phone"].ingame .stats3 small{font-size:9px}
[data-view="phone"].ingame .stats3 b{font-size:14px}
[data-view="phone"].ingame .ic{width:30px;height:30px;font-size:15px;border-radius:8px}
[data-view="phone"].ingame .clock{display:none}
[data-view="phone"].ingame .stage{padding:10px 12px;gap:6px;border-radius:12px}
[data-view="phone"].ingame .target{font-size:17px;min-height:2.6em;line-height:1.5}
[data-view="phone"].ingame .next{display:none}
[data-view="phone"].ingame #answer{padding:9px 12px;font-size:17px}
[data-view="phone"].ingame .msg{min-height:0}
.cover p{margin:0;color:var(--muted);max-width:40ch}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.hud{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.hud div{border:1px solid var(--line);border-radius:8px;padding:5px 9px;color:var(--muted)}
.hud b{color:var(--fg)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:10px;min-width:0}
.prev{margin:0;font-size:15px;min-height:1.5em;color:var(--muted)}
.prev .res{font-family:var(--mono);font-size:12px;margin-left:6px}
.next{margin:0;font-size:15px;color:var(--dim);min-height:1.5em}
.target{font-family:var(--mono);font-weight:700;font-size:clamp(18px,2.4vw,26px);line-height:1.55;margin:0;word-break:break-word;min-height:3.1em}
.target .w{display:inline-block;white-space:nowrap}
.target .l{color:var(--dim)}
.target .l.ok{color:var(--lamp);text-shadow:0 0 12px rgba(255,181,71,.45)}
.target .l.bad{color:var(--bad)}
.target .l.shown{color:var(--fg);opacity:.4}
.target .l.cur{border-bottom:3px solid var(--lamp)}
.target .p{color:var(--muted)}
.target.wait{font-family:var(--body);font-weight:500;color:var(--muted);font-size:18px}
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.stats3{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.stats3 small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stats3 b{font-family:var(--mono);font-size:18px}
.ctrl{display:flex;gap:6px}
.ic{width:42px;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:18px;line-height:1;display:grid;place-items:center}
.ic:hover{border-color:var(--lamp)}
.prog{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--lamp);transition:width .3s}
.clock{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;margin-top:-6px}
.target .ok{color:var(--lamp);text-shadow:0 0 12px rgba(255,181,71,.4)}
.target .bad{color:var(--bad)}
.target .skip{color:var(--muted);opacity:.6}
.wave{display:flex;flex-direction:column;align-items:center;gap:8px;padding-block:6px}
.wave svg{width:160px;height:32px}
.wave path{fill:none;stroke:var(--lamp);stroke-width:2;stroke-linecap:round}
.big small{font-size:.3em;color:var(--muted);font-weight:500;margin-left:.3em}
.timebar{height:5px;background:var(--line);border-radius:5px;overflow:hidden}
.timebar i{display:block;height:100%;background:var(--lamp);width:0}
.timebar.low i{background:var(--bad)}
.stage.flash{animation:flash .5s}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(127,227,165,.6)}100%{box-shadow:0 0 0 16px rgba(127,227,165,0)}}
#answer{width:100%;background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:13px 15px;font:500 18px var(--body)}
#answer:focus{border-color:var(--lamp);outline:none}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1 1 auto}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.sync b{font-family:var(--mono);color:var(--fg);min-width:5ch;text-align:center}
.msg{min-height:1.4em;margin:0;font-size:14px;color:var(--muted)}
.keys{font-size:12px;color:var(--muted);margin:0}
.keys kbd{font-family:var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px}
/* results */
.result{display:flex;flex-direction:column;gap:16px}
.big{font-family:var(--display);font-weight:800;font-size:clamp(44px,12vw,88px);color:var(--lamp);line-height:1;margin:0;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stats small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.stats b{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:10px}
.lines li{display:flex;gap:10px;font-size:14px}
.lines li span:first-child{font-family:var(--mono);width:4.5ch;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.g{color:var(--ok)}.m{color:var(--lamp)}.r{color:var(--bad)}
/* form */
form{display:flex;flex-direction:column;gap:10px;max-width:720px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
form input,form textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:16px var(--body);width:100%}
form textarea{min-height:160px;resize:vertical;font-family:var(--mono);font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.load{display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* PHONE VIEW */
[data-view="phone"] .wrap{max-width:460px;gap:14px;padding-block:12px 24px}
[data-view="phone"] .game{grid-template-columns:1fr;gap:10px}
[data-view="phone"] .vid{border-radius:10px}
[data-view="phone"] .songs{grid-template-columns:1fr}
[data-view="phone"] .row{grid-template-columns:1fr}
[data-view="phone"] .keys{display:none}
[data-view="phone"] .btn{padding:12px 14px;font-size:15px}
[data-view="phone"] .opt{flex-basis:100%}
[data-view="phone"] .target{font-size:clamp(17px,5.4vw,22px)}
[data-view="phone"] .actions .btn{flex:1 1 0}
@media (min-width:600px){[data-view="phone"] .wrap{border-inline:1px solid var(--line);border-radius:0 0 24px 24px;min-height:100vh}}
@media (max-width:820px){.game{grid-template-columns:1fr}}
@media (max-width:560px){.row{grid-template-columns:1fr}.keys{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo" id="home" tabindex="0">Допой<span>.</span>строчку</h1>
    <div class="hright">
      <div class="seg" id="viewSeg" role="group" aria-label="Версия"><button data-v="pc">ПК</button><button data-v="phone">Телефон</button></div>
    </div>
  </header>
  <main id="app"></main>
</div>

<script>
/* ===== Songs. yt = YouTube video id. Lyrics with timings load from lrclib.net in the browser. ===== */
const BUILTIN=[
  {id:'dynasty',title:'ДИНАСТИЯ',artist:'VILLIAN, madk1d',lrcArtist:'VILLIAN',yt:['J7NFL-eOxiQ','p-LBiCtzXu0'],off:{'J7NFL-eOxiQ':-2}},
  {id:'67',title:'67 (Six Seven)',artist:'GAZAN',lrcTitle:'67',yt:['XEGmDSAKJfk','a8sLiNEB9LU','yo5CILhgvT4','iTkVZdai1es'],latin:true},
  {id:'minimum',title:'Базовый минимум',artist:'Sabi, MIA BOYKA',lrcArtist:'MIA BOYKA',yt:['ujA0Hlg5-_g','ZcOgRAX6pDA','ndHnHIgQxys','btQe9LF-MOo']},
  {id:'rich',title:'Быть богатым',artist:'Voskresenskii, Платина',lrcArtist:'Voskresenskii',yt:['tzwyHxK_GK0','5ykv5hCMeW0','k2uiDdvtxks','X1-MXdyThJ0']}
];
const MOCK=/[?&]mock/.test(location.search);

const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const $=id=>document.getElementById(id);
const app=$('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isL=c=>/[0-9a-zа-яё]/i.test(c);
const norm=c=>c.toLowerCase().replace('ё','е');
const normStr=s=>[...s].filter(isL).map(norm).join('');
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const m=n%10;return n>10&&n<20?c:m>1&&m<5?b:m==1?a:c};
const fmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const allSongs=()=>BUILTIN.map(s=>({...s,...(store.get('dp_ov_'+s.id,{}))})).concat(store.get('dp_custom',[]));
let opt=Object.assign({wait:false,hide:false},store.get('dp_opt',{}));

/* ===== PC / phone switch (one app) ===== */
function setView(v){document.documentElement.dataset.view=v;store.set('dp_view',v);
  document.querySelectorAll('#viewSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v))}
let guess='pc';try{if(matchMedia('(pointer:coarse)').matches||innerWidth<600)guess='phone'}catch(e){}
setView(store.get('dp_view',guess));
document.querySelectorAll('#viewSeg button').forEach(b=>b.onclick=()=>setView(b.dataset.v));

/* ===== Lyrics: LRC from lrclib.net ===== */
function parseLRC(txt){
  const out=[];
  for(const raw of txt.split(/\r?\n/)){
    const tags=[...raw.matchAll(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g)];
    if(!tags.length)continue;
    const text=raw.replace(/\[[^\]]*\]/g,'').trim();
    for(const m of tags)out.push({t:+m[1]*60+parseFloat(m[2].replace(':','.')),text});
  }
  out.sort((a,b)=>a.t-b.t);
  return out;
}
// Returns every synced version lrclib has for the song: [{d: track duration in s, lrc}].
// The version whose length is closest to the YouTube clip is chosen later (clips often differ from the album).
async function fetchLRC(song){
  if(song.lrc)return [{d:0,lrc:song.lrc}];
  const cached=store.get('dp_lrcs_'+song.id,null);if(cached&&cached.length)return cached;
  if(MOCK)return [{d:12,lrc:MOCK_LRC}];
  const artist=song.lrcArtist||song.artist, track=song.lrcTitle||song.title;
  const api='https://lrclib.net/api/';
  const tries=[
    api+'search?'+new URLSearchParams({artist_name:artist,track_name:track}),
    api+'search?'+new URLSearchParams({q:artist+' '+track}),
    api+'search?'+new URLSearchParams({q:track})
  ];
  for(const u of tries){
    try{const r=await fetch(u);if(!r.ok)continue;const list=await r.json();
      let hits=list.filter(x=>x.syncedLyrics&&normStr(x.trackName).includes(normStr(track)));
      if(!hits.length)hits=list.filter(x=>x.syncedLyrics).slice(0,1);
      if(hits.length){const c=hits.map(x=>({d:+x.duration||0,lrc:x.syncedLyrics}));store.set('dp_lrcs_'+song.id,c);return c}}catch(e){}
  }
  return [];
}

/* ===== YouTube player ===== */
let ytReady=null;
function loadYT(){
  if(MOCK)return Promise.resolve();
  if(ytReady)return ytReady;
  ytReady=new Promise(res=>{window.onYouTubeIframeAPIReady=res;const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>{ytReady=null;const m=$('coverMsg');if(m)m.textContent='Не удалось загрузить YouTube. Проверь, открывается ли youtube.com в этом браузере, и нажми «Заново».';const r=$('retry');if(r)r.hidden=false};document.head.appendChild(s)});
  return ytReady;
}
function ytId(s){s=s.trim();const m=s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:(/^[\w-]{11}$/.test(s)?s:null)}

/* ===== Home ===== */
function home(){
  stopGame();document.documentElement.classList.remove('ingame');
  const best=store.get('dp_best',{});
  app.innerHTML=`<div style="display:flex;flex-direction:column;gap:20px">
   <section class="intro"><h2>Набери строчку, и песня пойдёт дальше</h2>
    <p>Играет клип, строчки появляются под звук. Печатай слово за словом: набрал слово, поле очищается для следующего. В конце строчки песня встаёт на паузу и ждёт тебя. Регистр, «ё» и знаки препинания не важны.</p></section>
   <div class="opts">
    <button class="opt" id="oHide" aria-pressed="${opt.hide}"><b>По памяти</b><small>${opt.hide?'Включено: текст скрыт, видно только количество букв':'Выключено: текст строчки виден, набираешь на скорость'}</small></button>
   </div>
   <div class="songs">${allSongs().map(s=>`
    <button class="song" data-id="${esc(s.id)}">
     <img alt="" loading="lazy" src="https://i.ytimg.com/vi/${esc([].concat(s.yt)[0])}/hqdefault.jpg">
     <span class="in"><span class="t">${esc(s.title)}</span><span class="a">${esc(s.artist)}</span>
     ${best[s.id]?`<span class="best">Рекорд: ${best[s.id]} слов/мин</span>`:''}
     ${s.custom?`<span class="del" data-del="${esc(s.id)}">удалить</span>`:''}</span></button>`).join('')}
    <button class="song add" id="addBtn"><span class="in"><span class="t">+ Добавить песню</span><span class="a">Ссылка на клип и название, текст подтянется сам</span></span></button>
   </div></div>`;
  $('oHide').onclick=()=>{opt.hide=!opt.hide;store.set('dp_opt',opt);home()};
  app.querySelectorAll('.song[data-id]').forEach(b=>b.onclick=e=>{
    const d=e.target.closest('[data-del]');
    if(d){store.set('dp_custom',store.get('dp_custom',[]).filter(s=>s.id!==d.dataset.del));home();return}
    start(allSongs().find(s=>s.id===b.dataset.id))});
  $('addBtn').onclick=()=>addForm();
}

/* ===== Add / fix song ===== */
function addForm(edit,note){
  nav('form');
  const s=edit||{};
  app.innerHTML=`<form id="f"><h2 class="logo" style="font-size:22px">${edit?'Поправить песню':'Своя песня'}</h2>
   ${note?`<p class="msg" style="color:var(--bad)">${esc(note)}</p>`:''}
   <label>Ссылка на клип YouTube<input id="fy" required value="${esc(s.yt?'https://youtu.be/'+[].concat(s.yt)[0]:'')}" placeholder="https://www.youtube.com/watch?v=..."></label>

let G=null;
function stopGame(){if(!G)return;G.dead=true;cancelAnimationFrame(G.raf);try{G.player&&G.player.destroy&&G.player.destroy()}catch(e){};G=null}

/* Mechanic: the clip plays; each line is typed word by word (the box clears after every word);

function wordsOf(text){

}

function focusInput(){const i=$('answer');if(i)i.focus({preventScroll:true});pinTop()}

/* Automatic sync with the clip: pick the lyrics version whose length matches the clip,

function autoSync(){

  const withD=G.cands.filter(c=>c.d>0);if(!withD.length)return;
  const best=withD.reduce((a,c)=>Math.abs(c.d-vd)<Math.abs(a.d-vd)?c:a);
  // a video much longer or shorter than the song is not the song (a stream, a reaction, a mix): take the next upload
  if(Math.abs(best.d-vd)>30){store.set('dp_okvid_'+G.song.id,null);if(nextVideo('Это видео не похоже на саму песню'))return true}
  if(best.lines!==G.lines&&G.i<0){G.lines=best.lines;$('next').textContent=G.lines[0].text;$('hl').textContent='0/'+G.lines.length}
  if(!G.manualOff){

    const diff=vd-best.d;

function showOffset(){$('ov').textContent=(G.offset>0?'+':'')+G.offset.toFixed(2).replace('.',',')}
function playing(){try{return G.player.getPlayerState()===1}catch(e){return false}}

function newLine(i){

function loop(){
  if(!G||G.dead||G.done)return;

  const t=now(),pf=performance.now(),isPlaying=playing();
  let dur=0;try{dur=G.player.getDuration()||0}catch(e){}
  $('ht').textContent=fmt(Math.max(0,t-G.offset))+' / '+fmt(dur);
  $('cPlay').textContent=isPlaying?'❚❚':'▶';
  let a=-1;for(let k=0;k<G.lines.length;k++){if(G.lines[k].t<=t+.02)a=k;else break}
  // seek detection: the clip time jumped (YouTube progress bar, double tap, our buttons)
  if(G.ignoreSeek&&pf<G.ignoreSeek){G.lastT=null}
  else if(G.lastT!=null){
    const expect=G.wasPlaying?(pf-G.lastPf)/1000:0;
    if(Math.abs((t-G.lastT)-expect)>1.2){G.lastT=t;G.lastPf=pf;G.wasPlaying=isPlaying;return onSeek(t,a)}
  }
  G.lastT=t;G.lastPf=pf;G.wasPlaying=isPlaying;
  if(G.i<0){
    const left=G.lines[0].t-t;
    if(a>=0)newLine(a);

  }

    if(t>=lineEnd(G.i)+TAIL){

    }

  }
  if(G.i===G.lines.length-1){if(t>=lineEnd(G.i)+TAIL)finish();else wave(t);return}
  if(a>G.i){newLine(a);return}

}
function onSeek(t,a){
  G.waiting=false;$('msg').textContent='';
  if(a<0){
    G.i=-1;G.L=null;$('answer').value='';$('wave').hidden=true;$('tg').hidden=false;
    $('tg').classList.add('wait');$('tg').textContent='Первая строчка скоро начнётся…';$('next').textContent=G.lines[0].text;

function paint(curIn){

function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function onType(){

   <p class="big">${wpm}<small> слов/мин</small></p>
   <div class="stats">
    <div><small>Набрано строчек</small><b>${full}/${lines.length}</b></div>
    <div><small>Точность</small><b>${acc}%</b></div>
    <div><small>Слов набрано</small><b>${G.words}</b></div>
    <div><small>Пропущено</small><b>${n-full}</b></div>
   </div>
   <div class="actions"><button class="btn main" id="again">Ещё раз</button><button class="btn" id="other">Другая песня</button></div>
   ${n?`<ul class="lines">${lines.map((l,k)=>res[k]?`<li><span class="${res[k].full?(res[k].pct>=90?'g':'m'):'r'}">${res[k].full?res[k].pct+'%':'—'}</span><span>${esc(l.text)}</span></li>`:'').join('')}</ul>`:''}
  </section>`;
  $('again').onclick=()=>start(song);$('other').onclick=goHome;
}

/* ===== test mode (?mock): fake player + fake lyrics, no network ===== */
const MOCK_LRC='[00:01.00]Первая тестовая строчка\n[00:04.00]Вторая yeah строчка тут\n[00:07.00]Третья и последняя';
function mockPlayer(){let t0=null,acc=0,st=-1;return{
  playVideo(){if(st!==1){t0=performance.now();st=1;if(!G.started){G.started=true;$('cover').hidden=true}}},
  pauseVideo(){if(st===1){acc+=(performance.now()-t0)/1000;st=2}},
  getCurrentTime(){return acc+(st===1?(performance.now()-t0)/1000:0)},
  getPlayerState(){return st},getDuration(){return 12},seekTo(x){acc=x;t0=performance.now()},destroy(){}}}

// PC: after clicking the YouTube player, keystrokes would go into it; bring the focus back to the typing box
window.addEventListener('blur',()=>{if(G&&!G.dead&&document.documentElement.dataset.view==='pc')setTimeout(()=>{if(document.activeElement&&document.activeElement.tagName==='IFRAME')focusInput()},150)});
/* Browser Back button: every screen other than the song list is one history entry above it */
function nav(v){try{if(history.state&&history.state.v)history.replaceState({v},'','#'+v);else history.pushState({v},'','#'+v)}catch(e){}}
function goHome(){try{if(history.state&&history.state.v){history.back();return}}catch(e){}home()}
window.addEventListener('popstate',()=>home());
try{if(location.hash)history.replaceState(null,'',location.pathname+location.search)}catch(e){}
const homeEl=$('home');homeEl.onclick=goHome;homeEl.onkeydown=e=>{if(e.key==='Enter')goHome()};
home();
</script>
